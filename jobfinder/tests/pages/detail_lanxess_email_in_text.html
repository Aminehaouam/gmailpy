<script id="ng-state" type="application/json">{"correlation-id": "14f888f9-4803-477e-a21c-b758b505de3b", "from-ssr": true, "jobdetail": {"stellenangebotsart": "AUSBILDUNG", "ausbildungsart": "AUSBILDUNG", "stellenangebotsTitel": "Ausbildung als Elektroniker für Automatisierungstechnik (w/m/d)", "stellenangebotsBeschreibung": "**LANXESS – im Kern der Chemie**\n\nCool, dass du dich für eine Karriere bei LANXESS interessierst. Wir sind einer der führenden globalen Spezialchemiekonzerne, wobei unser Name Programm ist: Die Verbindung aus dem französischen „lancer“ (etwas in Gang bringen) und dem englischen „success“ zeigt unseren unbedingten Erfolgswillen sowie unsere Bereitschaft zu kontinuierlicher Erneuerung. Dabei unterstützen uns ca. 11.500 Mitarbeitende weltweit.\n\n[**www.ausbildung-lanxess.de**](http://www.ausbildung-lanxess.de/)\n\n**Aus Chemie wird Faszination.**\n\n# Ausbildung als Elektroniker für Automatisierungstechnik (w/m/d)\n\n## Wir suchen neugierige Auszubildende für unsere Standorte in Leverkusen, Uerdingen, Dormagen und Bergkamen\n\n**Das Besondere an diesem Ausbildungsberuf**\n\nUm Produkte elektronisch gesteuert herzustellen, setzen wir bei LANXESS hochmoderne rechnergesteuerte Automatisierungsanlagen ein. Unsere Elektroniker:innen für Automatisierungstechnik sind für den störungsfreien Ablauf dieser Anlagen verantwortlich. Die Spezialist:innen haben sämtliche Messwerte wie Druck, Temperatur oder Durchflussmenge im Blick und sorgen dafür, dass die Einzelkomponenten ein automatisch arbeitendes Gesamtsystem bilden. Dabei reicht ihre Zuständigkeit und Verantwortung von der Montage der Automatisierungssysteme über die Wartung bis zur Beseitigung von Störungen.\n\n**Das lernst du**\n\n- Elektrische, hydraulische oder pneumatische Antriebssysteme einrichten und instand halten\n- Montieren, konfigurieren und programmieren von Sensor- und Betriebssystemen\n- Technische Störungen lokalisieren, analysieren und beheben mit spezieller Software\n- Einhalten von Sicherheits- und Umweltvorschriften in deutsch- und englischer Sprache\n- Durchführen von Testläufen\n\n**Das wünschen wir uns**\n\n- Freude an handwerklichem Arbeiten\n- Gutes räumliches Vorstellungs- und sicheres Farbsehvermögen\n- Analytische Denk- und Arbeitsweise\n- Interesse an technischen und physikalischen Zusammenhängen\n- Präzise und sichere zuverlässige Arbeitsweise\n- Aktive Mitarbeit um die Arbeitsziele im Team zu erreichen\n\n**Das erwartet dich**\n\n- Vermittlung von technischem Know-How\n- Einsatz in kompetenten Teams mit qualifizierten Ausbilder\\*innen\n- fachgerechte Schulungen und Unterweisungen für deine persönlichen Fähigkeiten\n- Kennenlernen verschiedenster elektrotechnischer Verfahren in Produktionsbetrieben\nund Werkstätten\n- Vielfältige Aufgaben in einem sozial verantwortlichen Unternehmen\n\n### Weitere Infos\n\n### Bewerbungsprozess\n\nIn vier Steps zur Berufsausbildung:\n\n- Step 1: Online-Bewerbung\n- Step 2: Online-Einstellungstest\n- Step 3: Bewerbergespräch\n- Step 4: Zusage (unter Vorbehalt der Zustimmung des Betriebsrates sowie dem Ergebnis der werksärztlichen Einstelluntersuchung)\n\n### Vergütung\n\nLANXESS zahlt eine attraktive Ausbildungsvergütung gemäß Manteltarifvertrag der chemischen Industrie.\n\n### Weiterbildung\n\nBei LANXESS wird jede Art der Weiterbildung und -entwicklung gefördert – mit speziellen Trainings, Workshops oder Seminaren. Passend zugeschnitten auf die individuellen Fähigkeiten und Bedürfnisse. Das Erlernen von neuen Fähigkeiten, die Verbesserung von Hard oder Soft Skills und die persönliche sowie berufliche Weiterentwicklung stehen im Fokus: Denn nur durch deine Fähigkeiten bleibt LANXESS erfolgreich.\n\n### Unsere Benefits\n\n- Attraktive monatliche Ausbildungsvergütung\n- Urlaubs-/Weihnachtsgeld sowie finanzielle Pauschale\n- Tariflich geförderte Altersvorsorge\n- Kostenfreie private Unfallversicherung\n- Weiterbildungsmöglichkeiten\n- Parkplätze für Betriebsangehörige\n- Freizeit- und Fitnessangebote
