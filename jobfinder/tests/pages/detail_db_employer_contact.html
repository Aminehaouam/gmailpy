e Spannung, Strom, Widerstand und Leistung vermittelt\n\n- Außerdem lernst du als Elektroniker:in für Betriebstechnik, Störungen in der Betriebstechnik zu analysieren und zu beseitigen\n\n- Kenntnisse zu Mess-, Prüf- und Diagnoseverfahren werden dir auch vermittelt\n\n- Du sorgst auch dafür, dass alle elektronischen Bauteile in unseren Zügen, wie z. B. die Türen und Info-Displays, fehlerfrei funktionieren\n\n\nDein Profil:\n\n\n- Du hast die Schule (bald) erfolgreich beendet und dein Schulabschluss ist in Deutschland anerkannt. Besonders Mathe und Physik machen dir Spaß\n- Deine Deutschkenntnisse entsprechen mindestens dem B2-Sprachniveau\n\n- Du bist handwerklich geschickt und tüftelst gern an elektronischen Bauteilen\n- Teamfähigkeit, Zuverlässigkeit und das selbständige Arbeiten zählen zu deinen Stärken\n\n\n.\n\nDas ist uns wichtig:\n\nUnser Anspruch ist es, allen Kandidat:innen bei gleicher Eignung die gleichen Chancen für den Einstieg bei uns zu bieten. Wir fördern aktiv die Vielfalt und das Miteinander in unseren Teams. Wir schätzen jede Bewerbung, unabhängig von Geschlecht, Nationalität, ethnischer und sozialer Herkunft, Religion, Weltanschauung, Behinderung, Alter, Dauer der Arbeitslosigkeit sowie sexueller Orientierung und Identität.\n\nDeine Vorteile\n* Für den Erfolg deiner Ausbildung bieten wir die besten Voraussetzungen: Du erhältst von uns ein mobiles Endgerät, das du zum Lernen und auch privat nutzen kannst.\n* Wir bieten dir 16 Freifahrten innerhalb Deutschlands pro Jahr und weitere Fahrvergünstigungen wie z.B. DB Job-Ticket für deinen täglichen Arbeitsweg. Darüber hinaus gibt es günstige Mitnahmemöglichkeiten für Familie und Freunde.\n* Wir unterstützen dich in deiner neuen Stadt anzukommen! Wenn du vom bisherigen Wohnort länger als 2,5 Stunden täglich pendeln musst und dir eine näher gelegene Wohnung mietest, bekommst du von uns einen Mietkostenzuschuss von bis zu 400 € pro Monat.\n* Je nach Ausbildungsjahr zwischen 1.324 Euro und 1.531 Euro im Mo
